<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D View Test - Simple</title>
    
    <!-- Cesium CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #cesiumContainer {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        .status-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 400px;
        }
        
        .status-panel h3 {
            color: #1B5E20;
            margin-bottom: 10px;
        }
        
        .status-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        
        .status-ok {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .status-error {
            color: #f44336;
            font-weight: bold;
        }
        
        .status-loading {
            color: #FF9800;
            font-weight: bold;
        }
        
        button {
            background: #1B5E20;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        
        button:hover {
            background: #2E7D32;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer">
        <div class="status-panel">
            <h3>🔍 3D View Diagnostic Test</h3>
            <div class="status-item">
                <strong>Cesium Library:</strong> <span id="cesiumStatus" class="status-loading">Checking...</span>
            </div>
            <div class="status-item">
                <strong>Token Status:</strong> <span id="tokenStatus" class="status-loading">Checking...</span>
            </div>
            <div class="status-item">
                <strong>Viewer Status:</strong> <span id="viewerStatus" class="status-loading">Checking...</span>
            </div>
            <div class="status-item">
                <strong>Internet:</strong> <span id="internetStatus" class="status-loading">Checking...</span>
            </div>
            <div id="errorDetails" style="margin-top: 10px; color: #f44336; display: none;">
                <strong>Error Details:</strong>
                <pre id="errorText" style="background: #ffebee; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto;"></pre>
            </div>
            <button onclick="location.reload()">🔄 Retry</button>
            <button onclick="window.location.href='index.html'" style="background: #0288D1;">← Back to Main Map</button>
        </div>
    </div>

    <!-- Cesium JS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Cesium.js"></script>
    
    <script>
        console.log('=== 3D VIEW DIAGNOSTIC TEST ===');
        
        // Status elements
        const cesiumStatus = document.getElementById('cesiumStatus');
        const tokenStatus = document.getElementById('tokenStatus');
        const viewerStatus = document.getElementById('viewerStatus');
        const internetStatus = document.getElementById('internetStatus');
        const errorDetails = document.getElementById('errorDetails');
        const errorText = document.getElementById('errorText');
        
        // Check internet connection
        if (navigator.onLine) {
            internetStatus.textContent = '✅ Online';
            internetStatus.className = 'status-ok';
        } else {
            internetStatus.textContent = '❌ Offline';
            internetStatus.className = 'status-error';
        }
        
        // Check if Cesium loaded
        if (typeof Cesium !== 'undefined') {
            cesiumStatus.textContent = '✅ Loaded';
            cesiumStatus.className = 'status-ok';
            console.log('✅ Cesium library loaded successfully');
        } else {
            cesiumStatus.textContent = '❌ Failed to load';
            cesiumStatus.className = 'status-error';
            console.error('❌ Cesium library failed to load');
            showError('Cesium library not found. Check internet connection.');
        }
        
        // Your Cesium Ion token
        const YOUR_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxNWE1NjRkMC1lYzM1LTQyZTQtODBmZS04YjUzZGQ3MWZjMzEiLCJpZCI6NDM2ODM0LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzk4MzU5MjB9.Wj3VxCOrvGAcT1GRgZuM_VIc0qD2u0zChy0_70yAmjg';
        
        function showError(message) {
            errorDetails.style.display = 'block';
            errorText.textContent = message;
        }
        
        // Initialize Cesium
        try {
            if (typeof Cesium !== 'undefined') {
                // Set token
                Cesium.Ion.defaultAccessToken = YOUR_TOKEN;
                tokenStatus.textContent = '✅ Set';
                tokenStatus.className = 'status-ok';
                console.log('✅ Token set successfully');
                
                // Create viewer
                viewerStatus.textContent = '⏳ Creating viewer...';
                viewerStatus.className = 'status-loading';
                
                const viewer = new Cesium.Viewer('cesiumContainer', {
                    baseLayerPicker: false,
                    geocoder: false,
                    homeButton: true,
                    sceneModePicker: false,
                    navigationHelpButton: true,
                    animation: false,
                    timeline: false,
                    fullscreenButton: true,
                    vrButton: false,
                    infoBox: true,
                    selectionIndicator: true
                });
                
                viewerStatus.textContent = '✅ Viewer created!';
                viewerStatus.className = 'status-ok';
                console.log('✅ Cesium viewer created successfully');
                
                // Fly to Kitwe
                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(28.2134, -12.8103, 20000),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-45),
                        roll: 0.0
                    },
                    duration: 3
                });
                
                // Add a test marker
                viewer.entities.add({
                    name: 'Kitwe City Center',
                    position: Cesium.Cartesian3.fromDegrees(28.2134, -12.8103, 0),
                    point: {
                        pixelSize: 20,
                        color: Cesium.Color.LIMEGREEN,
                        outlineColor: Cesium.Color.WHITE,
                        outlineWidth: 3
                    },
                    label: {
                        text: 'Kitwe, Zambia',
                        font: '16px sans-serif',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -25)
                    }
                });
                
                console.log('✅ Test marker added');
                console.log('=== 3D VIEW TEST SUCCESSFUL ===');
                
            }
        } catch (error) {
            viewerStatus.textContent = '❌ Failed';
            viewerStatus.className = 'status-error';
            console.error('❌ Error creating viewer:', error);
            showError(error.message + '\n\nFull error: ' + error.stack);
        }
        
        // Error handler
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            showError('Global error: ' + e.error.message);
        });
        
        // Log all console messages
        console.log('Token length:', YOUR_TOKEN.length);
        console.log('Navigator online:', navigator.onLine);
        console.log('Cesium defined:', typeof Cesium !== 'undefined');
    </script>
</body>
</html>
