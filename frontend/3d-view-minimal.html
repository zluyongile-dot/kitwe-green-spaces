<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D View - Minimal Test</title>
    
    <!-- Cesium CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        #cesiumContainer {
            width: 100%;
            height: 100vh;
        }
        
        .info-box {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            font-family: Arial, sans-serif;
        }
        
        .info-box h3 {
            margin: 0 0 10px 0;
            color: #1B5E20;
        }
        
        .status {
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
        }
        
        .status.loading {
            background: #FFF3E0;
            color: #E65100;
        }
        
        .status.success {
            background: #E8F5E9;
            color: #2E7D32;
        }
        
        .status.error {
            background: #FFEBEE;
            color: #C62828;
        }
        
        button {
            background: #1B5E20;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px 5px 0 0;
            font-size: 14px;
        }
        
        button:hover {
            background: #2E7D32;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div class="info-box">
        <h3>🌍 3D View Test</h3>
        <div id="status1" class="status loading">⏳ Loading Cesium...</div>
        <div id="status2" class="status loading">⏳ Setting token...</div>
        <div id="status3" class="status loading">⏳ Creating viewer...</div>
        <div id="status4" class="status loading">⏳ Adding markers...</div>
        <div style="margin-top: 10px;">
            <button onclick="flyToKitwe()">📍 Fly to Kitwe</button>
            <button onclick="location.href='index.html'">← Back to Map</button>
        </div>
        <div id="errorBox" style="display: none; margin-top: 10px; padding: 10px; background: #FFEBEE; border-radius: 4px; color: #C62828; font-size: 12px;">
            <strong>Error:</strong>
            <pre id="errorText" style="margin: 5px 0 0 0; white-space: pre-wrap;"></pre>
        </div>
    </div>

    <!-- Cesium JS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Cesium.js"></script>
    
    <script>
        console.log('=== MINIMAL 3D VIEW TEST ===');
        
        const status1 = document.getElementById('status1');
        const status2 = document.getElementById('status2');
        const status3 = document.getElementById('status3');
        const status4 = document.getElementById('status4');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        
        let viewer;
        
        function showError(message, error) {
            console.error('❌', message, error);
            errorBox.style.display = 'block';
            errorText.textContent = message + '\n\n' + (error ? error.toString() : '');
        }
        
        function updateStatus(element, success, message) {
            element.className = 'status ' + (success ? 'success' : 'error');
            element.textContent = (success ? '✅ ' : '❌ ') + message;
        }
        
        // Step 1: Check Cesium loaded
        setTimeout(() => {
            if (typeof Cesium === 'undefined') {
                updateStatus(status1, false, 'Cesium failed to load');
                showError('Cesium library not found. Check internet connection.');
                return;
            }
            
            updateStatus(status1, true, 'Cesium loaded');
            console.log('✅ Cesium loaded');
            
            // Step 2: Set token
            try {
                Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxNWE1NjRkMC1lYzM1LTQyZTQtODBmZS04YjUzZGQ3MWZjMzEiLCJpZCI6NDM2ODM0LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzk4MzU5MjB9.Wj3VxCOrvGAcT1GRgZuM_VIc0qD2u0zChy0_70yAmjg';
                updateStatus(status2, true, 'Token set');
                console.log('✅ Token set');
            } catch (error) {
                updateStatus(status2, false, 'Token failed');
                showError('Failed to set token', error);
                return;
            }
            
            // Step 3: Create viewer
            try {
                console.log('Creating viewer...');
                viewer = new Cesium.Viewer('cesiumContainer', {
                    animation: false,
                    timeline: false,
                    baseLayerPicker: false,
                    geocoder: false,
                    homeButton: true,
                    sceneModePicker: false,
                    navigationHelpButton: true,
                    fullscreenButton: true
                });
                
                updateStatus(status3, true, 'Viewer created');
                console.log('✅ Viewer created');
                
                // Step 4: Add markers
                try {
                    const greenSpaces = [
                        { name: 'Kitwe City Center', lon: 28.2134, lat: -12.8103 },
                        { name: 'Mindolo Dam', lon: 28.2156, lat: -12.8234 },
                        { name: 'Nkana Golf Club', lon: 28.2089, lat: -12.8045 }
                    ];
                    
                    greenSpaces.forEach(space => {
                        viewer.entities.add({
                            name: space.name,
                            position: Cesium.Cartesian3.fromDegrees(space.lon, space.lat),
                            point: {
                                pixelSize: 20,
                                color: Cesium.Color.LIMEGREEN,
                                outlineColor: Cesium.Color.WHITE,
                                outlineWidth: 3
                            },
                            label: {
                                text: space.name,
                                font: '16px sans-serif',
                                fillColor: Cesium.Color.WHITE,
                                outlineColor: Cesium.Color.BLACK,
                                outlineWidth: 2,
                                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                                pixelOffset: new Cesium.Cartesian2(0, -25)
                            }
                        });
                    });
                    
                    updateStatus(status4, true, 'Markers added');
                    console.log('✅ Markers added');
                    
                    // Fly to Kitwe
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(28.2134, -12.8103, 50000),
                        duration: 3
                    });
                    
                    console.log('=== SUCCESS! 3D VIEW WORKING ===');
                    
                } catch (error) {
                    updateStatus(status4, false, 'Markers failed');
                    showError('Failed to add markers', error);
                }
                
            } catch (error) {
                updateStatus(status3, false, 'Viewer failed');
                showError('Failed to create viewer. Your browser may not support WebGL.', error);
            }
            
        }, 1000);
        
        function flyToKitwe() {
            if (viewer) {
                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(28.2134, -12.8103, 50000),
                    duration: 2
                });
            }
        }
        
        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            showError('Global error: ' + e.message, e.error);
        });
    </script>
</body>
</html>
