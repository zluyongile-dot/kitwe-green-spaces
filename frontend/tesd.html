<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kitwe Green Space GIS Platform</title>

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2E7D32;
      --primary-dark: #1B5E20;
      --primary-light: #4CAF50;
      --background: #F5F7FA;
      --surface: #FFFFFF;
      --border: #E0E0E0;
      --text-primary: #212121;
      --text-secondary: #757575;
      --danger: #D32F2F;
      --warning: #F57C00;
      --success: #388E3C;

      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);

      --sidebar-width: 340px;
      --nav-height: 64px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--background);
      color: var(--text-primary);
      overflow: hidden;
    }

    .topbar {
      height: var(--nav-height);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      color: var(--primary);
    }

    .brand i {
      font-size: 24px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      border: none;
      background: transparent;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-secondary);
      transition: 0.2s;
    }

    .nav-btn.active,
    .nav-btn:hover {
      background: rgba(46,125,50,0.1);
      color: var(--primary);
    }

    .layout {
      display: flex;
      margin-top: var(--nav-height);
      height: calc(100vh - var(--nav-height));
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 16px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
    }

    .stat {
      background: var(--background);
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      color: var(--primary);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    select,
    button,
    input {
      font-family: inherit;
    }

    select {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .content {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .floating-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: white;
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 18px;
      color: var(--primary);
    }

    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 999;
      min-width: 220px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
    }

    @media (max-width: 900px) {
      .sidebar {
        position: absolute;
        left: -100%;
        top: 0;
        bottom: 0;
        z-index: 1000;
        transition: 0.3s;
      }

      .sidebar.open {
        left: 0;
      }

      .nav-tabs {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <i class="fas fa-tree"></i>
      <span>Kitwe Green Space GIS</span>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active">Map</button>
      <button class="nav-btn">Events</button>
      <button class="nav-btn">Analytics</button>
      <button class="nav-btn">Planner</button>
    </div>

    <button class="btn" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
  </header>

  <main class="layout">

    <aside class="sidebar" id="sidebar">

      <div class="card">
        <h3>Search Green Spaces</h3>

        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search parks, wards, facilities...">
        </div>
      </div>

      <div class="card">
        <h3>Platform Statistics</h3>

        <div class="stats">
          <div class="stat">
            <strong>24</strong>
            <span>Parks</span>
          </div>

          <div class="stat">
            <strong>12</strong>
            <span>Wards</span>
          </div>

          <div class="stat">
            <strong>78%</strong>
            <span>Coverage</span>
          </div>

          <div class="stat">
            <strong>6</strong>
            <span>Events</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Filters</h3>

        <div class="filter-group">
          <select>
            <option>All Green Spaces</option>
            <option>Parks</option>
            <option>Gardens</option>
            <option>Recreational Areas</option>
          </select>

          <select>
            <option>All Wards</option>
            <option>Nkana</option>
            <option>Riverside</option>
            <option>Buchi</option>
          </select>

          <button class="btn">
            Apply Filters
          </button>
        </div>
      </div>

      <div class="card">
        <h3>Ward Coverage</h3>

        <p>Nkana - Healthy Coverage</p>
        <p>Buchi - Low Coverage</p>
        <p>Riverside - Critical Gap</p>
      </div>

    </aside>

    <section class="content">

      <div id="map"></div>

      <div class="floating-controls">
        <button class="control-btn">
          <i class="fas fa-location-arrow"></i>
        </button>

        <button class="control-btn">
          <i class="fas fa-layer-group"></i>
        </button>

        <button class="control-btn">
          <i class="fas fa-expand"></i>
        </button>
      </div>

      <div class="legend">
        <strong>Map Legend</strong>

        <div class="legend-item">
          <div class="legend-color" style="background:#388E3C"></div>
          <span>Healthy Coverage</span>
        </div>

        <div class="legend-item">
          <div class="legend-color" style="background:#F57C00"></div>
          <span>Low Coverage</span>
        </div>

        <div class="legend-item">
          <div class="legend-color" style="background:#D32F2F"></div>
          <span>Critical Gap</span>
        </div>
      </div>

    </section>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Map
    const map = L.map('map').setView([-12.8167, 28.2000], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Example Marker
    L.marker([-12.8167, 28.2000])
      .addTo(map)
      .bindPopup('<strong>Kitwe Central Park</strong><br>Healthy Green Space Coverage');

    // Sidebar Toggle
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>

</body>
</html>
